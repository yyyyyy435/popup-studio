*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt);line-height:1.6}
header{position:sticky;top:0;z-index:50;background:rgba(15,18,32,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header h1{font-size:17px;font-weight:700;letter-spacing:.5px}
.badge{font-size:12px;color:var(--sub);background:var(--card2);padding:3px 10px;border-radius:20px}
.spacer{flex:1}
button{font-family:inherit;cursor:pointer;border:none;border-radius:8px;font-size:13px;transition:.15s}
button:active{transform:scale(.97)}
.btn{background:var(--card2);color:var(--txt);padding:8px 14px;border:1px solid var(--line)}
.btn:hover{border-color:var(--acc)}

.tabs{display:flex;gap:6px;padding:0 24px;background:rgba(15,18,32,.94);border-bottom:1px solid var(--line);position:sticky;top:57px;z-index:49}
.tab{padding:12px 22px;font-size:14px;color:var(--sub);border-bottom:2px solid transparent;font-weight:600;cursor:pointer}
.tab.on{color:#fff;border-bottom-color:var(--acc)}
.tab .n{font-size:12px;color:var(--sub);margin-left:6px}
.wrap{max-width:1440px;margin:0 auto;padding:18px 24px 60px}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar input[type=text]{background:var(--card);border:1px solid var(--line);color:var(--txt);padding:9px 14px;border-radius:8px;width:260px;font-size:14px}
.toolbar input::placeholder{color:var(--sub)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:6px 13px;border-radius:20px;font-size:13px;background:var(--card);border:1px solid var(--line);color:var(--sub);cursor:pointer}
.chip.on{background:var(--accd);color:#fff;border-color:var(--accd)}
.chip.A.on{background:var(--A);border-color:var(--A)}.chip.B.on{background:var(--B);border-color:var(--B);color:#08351f}.chip.C.on{background:var(--C);border-color:var(--C);color:#4a1024}
.status{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 16px;margin-bottom:16px;font-size:13px;color:var(--sub);display:flex;align-items:center;gap:10px}
.status .dot{width:9px;height:9px;border-radius:50%;background:var(--ok);flex:none}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:12px;overflow:hidden;font-size:14px}
thead th{background:var(--card2);color:var(--sub);font-weight:600;text-align:left;padding:11px 14px;font-size:12px;letter-spacing:.5px}

tbody tr:hover{background:#20264260}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:6px;font-weight:600;white-space:nowrap}
.tag.A{background:#6c8cff22;color:var(--A);border:1px solid #6c8cff55}
.tag.B{background:#3ad29f22;color:var(--B);border:1px solid #3ad29f55}
.tag.C{background:#ff8fb022;color:var(--C);border:1px solid #ff8fb055}
.tag.angle{background:#ffffff10;color:var(--sub);border:1px solid var(--line);margin-top:4px}
.col-title{font-weight:600;color:#fff;font-size:14.5px}
.col-src{font-size:12px;color:var(--sub);margin-top:6px}

.prompt{color:#cdd6ff;background:#0d1024;border:1px dashed var(--line);border-radius:8px;padding:8px 10px;font-size:13px}

  const b=curBatch();
  if(!b||!b.hot_topics||!b.hot_topics.length){
    $("hotGrid").innerHTML=`<div class="empty"><h2>热点池为空</h2></div>`;
    $("hotTotal").textContent="0";$("hotSites").textContent="0";return;
  }
  const kw=$("hotSearch").value.trim().toLowerCase();
  const site=$("hotSiteSel").value;
  const usedOnly=$("usedOnly").checked;
  let list=b.hot_topics.filter(t=>{
    if(site&&t.site!==site)return false;
    if(usedOnly&&!t.used)return false;
    if(kw&&!t.title.toLowerCase().includes(kw))return false;
    return true;
  });
  $("hotTotal").textContent=b.hot_topics.length;
  $("hotSites").textContent=[...new Set(b.hot_topics.map(x=>x.site))].length;
  $("hotHint").textContent=`筛选出 ${list.length} 条`;
  const groups={};
  list.forEach(t=>{(groups[t.site]=groups[t.site]||[]).push(t);});
  let html="";
  Object.keys(groups).forEach(site=>{
    const arr=groups[site];const usedN=arr.filter(x=>x.used).length;
    html+=`<div class="hot-site"><h3>📍 ${esc(site)}<span class="st">${arr.length}条 · 采用${usedN}</span></h3><ul>`;
    arr.forEach((t,i)=>{
      html+=`<li class="${t.used?'used':''}"><span class="idx">${i+1}</span><span>${esc(t.title)}</span>${t.used?'<span class="usedtag">已采用</span>':''}</li>`;
    });
    html+="</ul></div>";
  });
  $("hotGrid").innerHTML=html;
}

function pickLine(el){
  document.querySelectorAll("#lineChips .chip").forEach(c=>c.classList.remove("on"));
  el.classList.add("on");STATE.curLine=el.dataset.line;renderMat();
}
function matFiltered(){
  const b=curBatch();if(!b||!b.items)return [];
  const kw=$("search").value.trim().toLowerCase();
  const angle=$("angleSel").value;
  return b.items.filter(it=>{
    if(STATE.curLine!=="ALL"&&it.line!==STATE.curLine)return false;
    if(angle&&it.angle!==angle)return false;
    if(kw&&!((it.title+it.copy+it.prompt+it.source_hint+(it.ref_topic||"")).toLowerCase().includes(kw)))return false;
    return true;
  });
}
function renderMat(){
  const b=curBatch();
  if(!b||!b.items||!b.items.length){
    $("tableWrap").innerHTML=`<div class="empty"><h2>还没有素材</h2></div>`;
    $("counts").innerHTML="";return;
  }
  const c=b.counts||{};
  $("counts").innerHTML=`<span class="cb A">A ${c.A||0}</span><span class="cb B">B ${c.B||0}</span><span class="cb C">C ${c.C||0}</span>`;
  const items=matFiltered();
  $("matHint").textContent=`共 ${items.length} 条`;
  if(!items.length){$("tableWrap").innerHTML=`<div class="empty"><p>没有符合条件的素材。</p></div>`;return;}
  let rows=items.map(it=>{
    let refHtml="";
    if(it.line==="A"&&it.ref_topic){refHtml=`<div class="ref">🔥 参考热点：${esc(it.ref_topic)}${it.ref_site?`（${esc(it.ref_site)}）`:""}</div>`;}
    else if(it.source_hint){refHtml=`<div class="col-src">母题：${esc(it.source_hint)}</div>`;}
    return `<tr>
      <td class="w-title"><div class="col-title">${esc(it.title)}</div>
        <div class="col-src">领域：${esc(it.domain||"-")}</div>${refHtml}</td>
      <td class="w-copy"><div>${esc(it.copy)}</div></td>
      <td class="w-prompt"><div class="prompt">${esc(it.prompt)}</div>
        <button class="mini" onclick="copy1(${jsq(it.prompt)})">复制 prompt</button></td>
      <td class="w-meta"><span class="tag ${it.line}">${it.line}线</span><br><span class="tag angle">${esc(it.angle)}</span></td>
      <td class="w-act"><div class="rowacts">
        <button class="mini" onclick="copyRow(${jsq(it.title)},${jsq(it.copy)},${jsq(it.prompt)})">复制整条</button>
      </div></td></tr>`;
  }).join("");
  $("tableWrap").innerHTML=`<table><thead><tr>
    <th>主标题 / 溯源</th><th>对话文案</th><th>上屏 Prompt</th><th>产线/角度</th><th>操作</th>
    </tr></thead><tbody>${rows}</tbody></table>`;
}

function copy1(t){navigator.clipboard.writeText(t);toast("已复制 prompt");}
function copyRow(t,c,p){navigator.clipboard.writeText(`【标题】${t}\n【文案】${c}\n【prompt】${p}`);toast("已复制整条");}
function copyAll(){
  const items=matFiltered();
  const text=items.map((it,i)=>`${i+1}. [${it.line}线·${it.angle}]${it.ref_topic?` 参考:${it.ref_topic}`:""}\n标题：${it.title}\n文案：${it.copy}\nprompt：${it.prompt}`).join("\n\n");
  navigator.clipboard.writeText(text);toast(`已复制 ${items.length} 条`);
}
function exportCSV(){
  const items=matFiltered();if(!items.length){toast("没有可导出的内容");return;}
  const head=["序号","产线","角度","生活领域","参考热点","热点来源","母题说明","主标题","对话文案","上屏prompt"];
  const rows=items.map((it,i)=>[i+1,it.line+"线",it.angle,it.domain,it.ref_topic||"",it.ref_site||"",it.source_hint,it.title,it.copy,it.prompt]);
  const csv=[head,...rows].map(r=>r.map(c=>`"${String(c||"").replace(/"/g,'""')}"`).join(",")).join("\r\n");
  const blob=new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`弹窗素材_${curBatch().date}.csv`;a.click();toast("已导出 CSV");
}

fillBatchSelect();
renderAll();

</script>
</body>
</html>
